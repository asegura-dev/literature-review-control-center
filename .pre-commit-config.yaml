# Hooks run before a commit (ADR-0002) and on its message (ADR-0008).
#
# Install once per clone:  .\run.ps1 run pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# ruff and mypy run through scripts/uv_run.py, not a bare `uv run`: inside a hook a bare call
# would create a .venv in the checkout, which ADR-0002 keeps out of synchronised folders. They
# check the whole project, exactly as the quality gate does, so a hook and the gate never disagree
# about which files count.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: python
        entry: python scripts/uv_run.py run ruff check .
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format --check
        language: python
        entry: python scripts/uv_run.py run ruff format --check .
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        language: python
        entry: python scripts/uv_run.py run mypy
        pass_filenames: false
        types: [python]
      - id: no-ai-attribution
        name: commit message names only the human author
        language: python
        entry: python scripts/check_commit_message.py
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
