[project]
name = "literature-review-control-center"
version = "0.8.0"
description = "Reproducible, auditable identification and screening for literature reviews."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Segura" }]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
lrcc = "lrcc.views.cli.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

# The distribution is `literature-review-control-center`; the import package is `lrcc` (ADR-0007).
[tool.uv.build-backend]
module-name = "lrcc"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, pydocstyle and bandit (ADR-0002).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest reports failures through `assert`; bandit's S101 exists for production code that may run
# with assertions stripped, which tests never do.
"tests/**" = ["S101"]
# The launcher's only job is to start uv, and S603 flags every process start. The executable is
# resolved with shutil.which and the arguments are the caller's own command line.
"scripts/uv_run.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = [
    "--strict-markers",
    "--cov=lrcc",
    "--cov-branch",
    "--cov-report=term-missing",
    # Fixed with the first real code, as ADR-0002 decided; lowering it weakens the gate.
    "--cov-fail-under=95",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]
